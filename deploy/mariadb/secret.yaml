# Example secret. In production, generate values with a secret manager and never commit them.
# Apply with:  kubectl apply -f deploy/mariadb/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-credentials
  namespace: cofrap
type: Opaque
stringData:
  MARIADB_ROOT_PASSWORD: "change-me-root"
  MARIADB_DATABASE: "cofrap"
  MARIADB_USER: "cofrap"
  MARIADB_PASSWORD: "cofrap"
