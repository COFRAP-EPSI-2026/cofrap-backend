# Valeurs par défaut pour le chart `cofrap`.
# Override via `helm install --set` ou `-f values-prod.yaml`.

nameOverride: ""
fullnameOverride: ""

# -- Namespace OpenFaaS où vivent les fonctions et leurs secrets.
# Doit matcher la valeur `functionNamespace` du chart `openfaas/openfaas`.
openfaas:
  functionNamespace: openfaas-fn
  # URL informative, affichée dans NOTES.txt après install.
  gatewayURL: "http://127.0.0.1:8080"

# -- Secrets sensibles.
# **Vide par défaut** : les scripts `install.sh` / `install.ps1` génèrent les valeurs
# et les passent à Helm via `--set`. Tu peux aussi les fournir manuellement.
secrets:
  # -- Si `true` (défaut), le chart CRÉE les 3 Secrets (encryption-key,
  # mariadb-password dans openfaas-fn + <release>-mariadb-credentials) à partir
  # des valeurs ci-dessous. C'est le mode des scripts install.sh/.ps1 (Phase 1).
  #
  # Mettre à `false` en GitOps (ArgoCD) : le chart ne crée NI ne valide les
  # secrets — ils doivent être pré-créés dans le cluster (à la main, Sealed
  # Secrets, External Secrets Operator…). Évite de stocker des secrets en Git.
  create: true
  # Clé Fernet (32 bytes URL-safe base64) pour chiffrer password/mfa en BDD.
  # Générer avec : python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  encryptionKey: ""
  # Mot de passe applicatif MariaDB (utilisateur `mariadb.user`).
  mariadbPassword: ""
  # Mot de passe root MariaDB (utilisé pour les opérations admin du StatefulSet).
  mariadbRootPassword: ""

# -- Configuration MariaDB.
mariadb:
  enabled: true
  image:
    repository: mariadb
    tag: "11"
    pullPolicy: IfNotPresent
  database: cofrap
  user: cofrap
  service:
    port: 3306
    # `ClusterIP` (défaut) ou `None` pour headless service.
    type: ClusterIP
  persistence:
    enabled: true
    size: 2Gi
    # Laisser vide pour utiliser la storageClass par défaut du cluster.
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# -- Fonctions OpenFaaS (créées comme Deployment + Service dans `openfaas.functionNamespace`).
functions:
  enabled: true
  # Registry + tag des images. Override pour pointer vers ton propre fork.
  registry: ghcr.io/cofrap-epsi-2026
  version: "2026.4.0"  # x-release-please-version
  pullPolicy: IfNotPresent

  # Variables d'environnement passées à toutes les fonctions.
  totpIssuer: COFRAP
  expirySeconds: "15552000"  # 6 mois
  # CORS — origines autorisées à appeler l'API depuis un navigateur.
  # "*" (défaut) ou liste séparée par virgules : "https://app.cofrap.example.com,http://localhost:5173"
  corsAllowOrigins: "*"

  # Timeouts of-watchdog.
  timeouts:
    read: 30s
    write: 30s
    exec: 30s

  # Scaling OpenFaaS (Community : scale-to-zero après idle).
  scale:
    min: "1"
    max: "5"

  # Liste explicite des fonctions à déployer. Modifier ici si tu veux désactiver.
  list:
    - generate-password
    - generate-2fa
    - authenticate-user
