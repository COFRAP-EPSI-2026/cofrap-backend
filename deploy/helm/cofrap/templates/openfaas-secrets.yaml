{{/*
Secrets consommés par les fonctions OpenFaaS — créés dans le namespace `openfaas-fn`
pour être montés en tmpfs sur `/var/openfaas/secrets/` par OpenFaaS.

Créés uniquement si `secrets.create=true` (Phase 1 / scripts install). En GitOps
(`secrets.create=false`), ils sont pré-créés hors du chart — cf. argocd/README.
*/}}
{{- if .Values.secrets.create }}
{{- include "cofrap.requireSecrets" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-password
  namespace: {{ .Values.openfaas.functionNamespace }}
  labels:
    {{- include "cofrap.labels" . | nindent 4 }}
    app.kubernetes.io/component: openfaas-secret
type: Opaque
stringData:
  mariadb-password: {{ .Values.secrets.mariadbPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: encryption-key
  namespace: {{ .Values.openfaas.functionNamespace }}
  labels:
    {{- include "cofrap.labels" . | nindent 4 }}
    app.kubernetes.io/component: openfaas-secret
type: Opaque
stringData:
  encryption-key: {{ .Values.secrets.encryptionKey | quote }}
{{- end }}
