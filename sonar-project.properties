# sonar-project.properties
# Configuration SonarQube pour le projet COFRAP Backend

# --- Informations Projet ---
sonar.projectKey=cofrap-backend
sonar.projectName=COFRAP Backend
sonar.projectVersion=2026.3.3
sonar.projectDescription=Backend du projet COFRAP, développé en Python avec OpenFaaS, gérant les fonctions de création de QR codes, de chiffrement et d accès à la base de données.

# --- Chemins des sources et tests ---
# On analyse les 3 fonctions OpenFaaS.
# Les modules dupliqués (db.py, crypto.py, qr.py) sont volontairement inclus dans chaque fonction
# pour que Sonar vérifie leur conformité dans chaque contexte d'exécution OpenFaaS.
sonar.sources=functions/
sonar.tests=tests/
sonar.python.version=3.12

# --- Encodage ---
sonar.sourceEncoding=UTF-8

# --- Exclusions ---
# On exclut les environnements virtuels et les caches
sonar.exclusions=**/.venv/**, **/venv/**, **/.pytest_cache/**, **/.ruff_cache/**, **/bruno/**, scripts/**

# --- Couverture de code (Pytest + Coverage.py) ---
# Le rapport est généré par `pytest --cov=functions --cov-report=xml`
sonar.python.coverage.reportPaths=coverage.xml

# --- Rapports de Tests (JUnit XML) ---
# Pour avoir le détail des succès/échecs dans l'interface Sonar
sonar.junit.reportPaths=pytest-report.xml

# --- Linting ---
# SonarQube peut importer les issues de Ruff si on génère un rapport JSON.
# Commande : `ruff check . --output-format json --output ruff-report.json`
sonar.python.ruff.reportPaths=ruff-report.json

# --- Duplications ---
# Vu l'architecture OpenFaaS (duplication intentionnelle de modules utilitaires),
# on peut vouloir augmenter le seuil de détection de duplication ou ignorer ces fichiers
# pour ne pas polluer le score de "Technical Debt".
sonar.cpd.exclusions=functions/*/db.py, functions/*/crypto.py, functions/*/qr.py
