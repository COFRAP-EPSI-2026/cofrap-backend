services:
  gateway:
    image: nginx:alpine
    container_name: cofrap-gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - generate-password
      - generate-2fa
      - authenticate-user
    networks:
      - web

  mariadb:
    image: mariadb:11
    container_name: cofrap-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${DB_NAME:-cofrap}
      MARIADB_USER: ${DB_USER:-cofrap}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-cofrap_dev}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb-admin ping -h 127.0.0.1 -u root -p"$$MARIADB_ROOT_PASSWORD"
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - web

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: cofrap-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_USER: ${DB_USER:-cofrap}
      PMA_PASSWORD: ${DB_PASSWORD:-cofrap_dev}
    ports:
      - "8082:80"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - web

  generate-password:
    container_name: cofrap-generate-password
    build:
      context: ./functions/generate-password
    env_file: .env
    volumes:
      - ./functions/generate-password:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8080 --reload
    depends_on:
      - mariadb
    networks:
      - web

  generate-2fa:
    container_name: cofrap-generate-2fa
    build:
      context: ./functions/generate-2fa
    env_file: .env
    volumes:
      - ./functions/generate-2fa:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8080 --reload
    depends_on:
      - mariadb
    networks:
      - web

  authenticate-user:
    container_name: cofrap-authenticate-user
    build:
      context: ./functions/authenticate-user
    env_file: .env
    volumes:
      - ./functions/authenticate-user:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8080 --reload
    depends_on:
      - mariadb
    networks:
      - web

volumes:
  mariadb_data:

networks:
  web:
    driver: bridge
