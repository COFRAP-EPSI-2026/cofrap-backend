name: CI

on:
  pull_request:
    branches: [main, dev]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint with Ruff
        run: ruff check .
      - name: Generate Ruff JSON report for Sonar
        run: ruff check . --output-format json --output ruff-report.json
        continue-on-error: true # On ne veut pas bloquer si ruff trouve des erreurs, Sonar les affichera
      - run: ruff format --check .
      - name: Upload Ruff report
        uses: actions/upload-artifact@v4
        with:
          name: ruff-report
          path: ruff-report.json

  security-sast:
    name: Security Scan (Bandit + Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nécessaire pour Gitleaks pour scanner l'historique
      - name: Gitleaks (Secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bandit (SAST)
        run: |
          pip install bandit
          bandit -c .bandit.yml -r functions/ -ll

  security-sca:
    name: Dependency Scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          pip install pip-audit
          # On scanne toutes les fonctions et les deps de dev
          pip-audit -r requirements-dev.txt
          pip-audit -r functions/authenticate-user/requirements.txt
          pip-audit -r functions/generate-2fa/requirements.txt
          pip-audit -r functions/generate-password/requirements.txt

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: cofrap
          MARIADB_USER: cofrap
          MARIADB_PASSWORD: cofrap_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: cofrap
      DB_USER: cofrap
      MARIADB_PASSWORD: cofrap_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Wait for MariaDB
        # GHA attend déjà la `health-cmd` du service avant de lancer les steps,
        # mais on garde un sanity-check qui utilise PyMySQL (déjà installé)
        # pour ne dépendre d'aucun client CLI sur l'image runner.
        run: |
          python - <<'PY'
          import sys, time
          import pymysql

          last_err = None
          for _ in range(30):
              try:
                  conn = pymysql.connect(
                      host="127.0.0.1", port=3306,
                      user="cofrap", password="cofrap_dev",
                      database="cofrap", connect_timeout=2,
                  )
                  conn.close()
                  print("MariaDB ready")
                  sys.exit(0)
              except Exception as exc:
                  last_err = exc
                  time.sleep(2)

          print(f"MariaDB never became reachable: {last_err}", file=sys.stderr)
          sys.exit(1)
          PY
      - name: Run unit + integration tests with coverage
        run: |
          pytest \
            --cov=functions \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=pytest-report.xml
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage.xml
            pytest-report.xml
          if-no-files-found: ignore

  docker-build:
    name: Build images (no push)
    runs-on: ubuntu-latest
    needs: [lint, test, security-sast, security-sca]
    strategy:
      matrix:
        function: [generate-password, generate-2fa, authenticate-user]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.function }}
        uses: docker/build-push-action@v6
        with:
          context: ./functions/${{ matrix.function }}
          load: true # Charge l'image localement pour Trivy
          push: false
          tags: cofrap/${{ matrix.function }}:ci-${{ github.run_id }}
          cache-from: type=gha,scope=${{ matrix.function }}
          cache-to: type=gha,mode=max,scope=${{ matrix.function }}
      - name: Trivy (Container Scan)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cofrap/${{ matrix.function }}:ci-${{ github.run_id }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Download coverage and ruff reports
        uses: actions/download-artifact@v4
        with:
          pattern: '*-report*' # Récupère ruff-report et coverage-...
          merge-multiple: true
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GHCR_PAT_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
